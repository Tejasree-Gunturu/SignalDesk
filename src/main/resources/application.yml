spring:
  application:
    name: signaldesk
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/signaldesk}
    username: ${SPRING_DATASOURCE_USERNAME:signaldesk}
    password: ${SPRING_DATASOURCE_PASSWORD:signaldesk}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        delivery.timeout.ms: 6000
        request.timeout.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 20
    listener:
      ack-mode: record
      concurrency: 3
  task:
    scheduling:
      pool:
        size: 2
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
logging:
  structured:
    format:
      console: logstash
signaldesk:
  assignment: ${ASSIGNMENT_POLICY:round-robin}
  kafka:
    enabled: true
    topic: incident-events
  outbox:
    enabled: true
    poll-ms: 1000
  consumer:
    enabled: false
  dispatcher:
    enabled: false
  escalation:
    enabled: false
    poll-ms: 10000
  notifications:
    channel: ${NOTIFICATION_CHANNEL:log}
    webhook-url: ${NOTIFICATION_WEBHOOK_URL:}
    max-attempts: 4
    poll-ms: 500
  redis:
    enabled: true
    requests-per-minute: 120
  auth:
    # Local demo accounts. Override ALL three tokens before sharing a deployment.
    accounts:
      - username: maya
        tenant-id: acme
        role: ADMIN
        token: ${SIGNALDESK_ADMIN_TOKEN:dev-acme-admin-change-me}
      - username: reader
        tenant-id: acme
        role: VIEWER
        token: ${SIGNALDESK_VIEWER_TOKEN:dev-acme-viewer-change-me}
      - username: responder
        tenant-id: beta
        role: RESPONDER
        token: ${SIGNALDESK_BETA_TOKEN:dev-beta-responder-change-me}
